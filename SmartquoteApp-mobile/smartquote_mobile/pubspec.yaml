name: smartquote_mobile
description: "SmartQuote mobile client for the poultry purchasing workflow."

version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  intl: ^0.20.2
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  file_picker: ^13.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

